name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned compiler
        shell: powershell
        run: ./scripts/bootstrap.ps1
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1
      - name: Package unsigned development installer
        shell: powershell
        run: ./scripts/package.ps1
      - name: Export source archive
        shell: powershell
        run: ./scripts/export-source.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: atypoi-windows-x64-dev
          path: dist/
          retention-days: 14
