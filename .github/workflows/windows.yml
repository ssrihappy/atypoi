name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned compiler
        shell: powershell
        run: ./scripts/bootstrap.ps1
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1
      - name: Package unsigned development installer
        shell: powershell
        run: ./scripts/package.ps1
      - name: Export source archive
        shell: powershell
        run: ./scripts/export-source.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: atypoi-windows-x64-dev
          path: dist/
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    concurrency:
      group: public-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atypoi-windows-x64-dev
          path: dist
      - name: Publish verified release and update feed
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATYPOI_REQUIRE_SIGNED_RELEASE: ${{ vars.REQUIRE_SIGNED_RELEASE }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG
